name: Run Test Suite

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
      - review_requested
    paths: ["**/*.ts"]

jobs:
  test-suite:
    name: Run Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Vitest
        run: pnpm test
