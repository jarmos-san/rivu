name: Create Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  id-token: write
  contents: read

jobs:
  run-eslint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run ESLint
        run: pnpm lint

  run-oxfmt:
    name: Run Oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Formatters
        run: pnpm run fmt:check

  run-tests:
    name: Run Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Vitest
        run: pnpm test

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - run-eslint
      - run-prettier
      - run-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Create Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ github.ref_name }}"
        run: |
          gh release create "$TAG" \
          --title "$TAG" \
          --generate-notes \
          --verify-tag \

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs:
      - run-eslint
      - run-prettier
      - run-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "25.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Build the Package
        run: pnpm build

      - name: Publish the Package
        run: pnpm publish --access public --no-git-checks
