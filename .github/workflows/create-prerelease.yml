name: Create Pre-Release

on:
  push:
    tags: ["v*.*.*-alpha"]

jobs:
  run-oxlint:
    name: Run Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Oxlint
        run: pnpm lint

  run-oxfmt:
    name: Run Oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Formatters
        run: pnpm run fmt:check

  run-tests:
    name: Run Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Run Vitest
        run: pnpm test

  create-release:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - run-oxlint
      - run-oxfmt
      - run-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Create Pre-Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ github.ref_name }}"
        run: |
          gh release create "$TAG" \
          --title "$TAG" \
          --generate-notes \
          --prerelease \
          --verify-tag
